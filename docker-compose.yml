version: "3.9"
# PHASE 4 — Added Redis + Celery worker
services:
  db:
    image: timescale/timescaledb:latest-pg15
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: pipe
      POSTGRES_PASSWORD: pipe
      POSTGRES_DB: pipe_db
    volumes: [pg_data:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://pipe:pipe@db:5432/pipe_db
      REDIS_URL: redis://redis:6379
    depends_on: [db, redis]
    volumes: [.:/app]

  worker:
    build: .
    command: celery -A app.workers.monitor_task.celery_app worker --beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://pipe:pipe@db:5432/pipe_db
      REDIS_URL: redis://redis:6379
    depends_on: [db, redis]

volumes:
  pg_data:
